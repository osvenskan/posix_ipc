name: Build and test wheels

on:
  push:
    branches:
      - develop
      - master
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-build
  cancel-in-progress: true

jobs:
  build_wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15]

    steps:
      - uses: actions/checkout@v4

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ENABLE: pypy
          CIBW_TEST_COMMAND: python -m unittest discover --start-directory {package}
